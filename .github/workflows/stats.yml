name: Generate Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          token = os.environ["GITHUB_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          username = "BananaOfficial"
          org = "RequestTimeout"

          def get(url):
              r = requests.get(url, headers=headers)
              r.raise_for_status()
              return r.json()

          user = get(f"https://api.github.com/users/{username}")

          repos = []
          page = 1

          while True:
              data = get(
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}"
              )
              if not data:
                  break
              repos.extend(data)
              page += 1

          public_repos = user["public_repos"]
          total_stars = sum(r["stargazers_count"] for r in repos)
          status = user.get("bio") or ""

          query = """
          query($login:String!) {
            user(login:$login) {
              contributionsCollection {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalPullRequestReviewContributions
              }
            }
          }
          """

          r = requests.post(
              "https://api.github.com/graphql",
              headers=headers,
              json={
                  "query": query,
                  "variables": {"login": username}
              }
          )

          r.raise_for_status()
          contribution_data = r.json()["data"]["user"]["contributionsCollection"]

          total_contributions = sum([
              contribution_data["totalCommitContributions"],
              contribution_data["totalIssueContributions"],
              contribution_data["totalPullRequestContributions"],
              contribution_data["totalPullRequestReviewContributions"]
          ])

          views_file = "views.json"

          if os.path.exists(views_file):
              with open(views_file, "r") as f:
                  views_history = json.load(f)
          else:
              views_history = {}

          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          today_views = 0

          page = 1

          while True:
              data = get(
                  f"https://api.github.com/orgs/{org}/repos"
                  f"?per_page=100&page={page}"
              )

              if not data:
                  break

              for repo in data:
                  try:
                      traffic = get(
                          f"https://api.github.com/repos/{org}/{repo['name']}/traffic/views"
                      )
                      today_views += traffic.get("count", 0)
                  except requests.HTTPError:
                      pass

              page += 1

          views_history[today] = today_views
          total_views = sum(views_history.values())

          with open(views_file, "w") as f:
              json.dump(views_history, f, indent=2)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0d1117"/>
              <stop offset="100%" stop-color="#161b22"/>
            </linearGradient>
            <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#58a6ff"/>
              <stop offset="100%" stop-color="#bc8cff"/>
            </linearGradient>
            <filter id="shadow">
              <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.35"/>
            </filter>
          </defs>

          <rect x="5" y="5" width="890" height="320" rx="24"
                fill="url(#bg)" stroke="#30363d" stroke-width="2" filter="url(#shadow)"/>

          <circle cx="62" cy="62" r="28" fill="url(#accent)"/>
          <text x="62" y="72" text-anchor="middle"
                font-family="Arial,sans-serif" font-size="28" font-weight="bold"
                fill="white">B</text>

          <text x="105" y="57"
                font-family="Arial,sans-serif" font-size="27" font-weight="bold"
                fill="white">BananaOfficial</text>

          <text x="105" y="82"
                font-family="Arial,sans-serif" font-size="15"
                fill="#8b949e">{status}</text>

          <line x1="35" y1="112" x2="865" y2="112"
                stroke="#30363d" stroke-width="1"/>

          <rect x="35" y="135" width="190" height="105" rx="16"
                fill="#161b22" stroke="#30363d"/>
          <text x="55" y="165"
                font-family="Arial,sans-serif" font-size="14"
                fill="#8b949e">TOTAL STARS</text>
          <text x="55" y="207"
                font-family="Arial,sans-serif" font-size="32" font-weight="bold"
                fill="#58a6ff">{total_stars}</text>

          <rect x="245" y="135" width="190" height="105" rx="16"
                fill="#161b22" stroke="#30363d"/>
          <text x="265" y="165"
                font-family="Arial,sans-serif" font-size="14"
                fill="#8b949e">PUBLIC REPOS</text>
          <text x="265" y="207"
                font-family="Arial,sans-serif" font-size="32" font-weight="bold"
                fill="#58a6ff">{public_repos}</text>

          <rect x="455" y="135" width="190" height="105" rx="16"
                fill="#161b22" stroke="#30363d"/>
          <text x="475" y="165"
                font-family="Arial,sans-serif" font-size="14"
                fill="#8b949e">TOTAL VIEWS</text>
          <text x="475" y="207"
                font-family="Arial,sans-serif" font-size="32" font-weight="bold"
                fill="#58a6ff">{total_views}</text>

          <rect x="665" y="135" width="200" height="105" rx="16"
                fill="#161b22" stroke="#30363d"/>
          <text x="685" y="165"
                font-family="Arial,sans-serif" font-size="14"
                fill="#8b949e">CONTRIBUTIONS</text>
          <text x="685" y="207"
                font-family="Arial,sans-serif" font-size="32" font-weight="bold"
                fill="#bc8cff">{total_contributions}</text>

          <text x="450" y="285" text-anchor="middle"
                font-family="Arial,sans-serif" font-size="13"
                fill="#484f58">Generated automatically by RequestTimeout</text>
          </svg>'''

          with open("stats.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg views.json
          git diff --cached --quiet || git commit -m "Update stats"
          git push
