name: Generate Repository Statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate repository statistics SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          USER = "BananaOfficial"
          ORGANIZATION = "RequestTimeout"

          MAX_REPOS = 30

          HIDDEN_REPOS = {
             "RequestTimeout/.github",
             "RequestTimeout/discussions"
          }


          def github_get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2026-03-10",
                  },
              )

              with urllib.request.urlopen(request) as response:
                  return response.status, json.load(response)


          def get_all_repositories(url):
              repositories = []
              page = 1

              while True:
                  status, data = github_get(
                      f"{url}?per_page=100&page={page}&sort=updated"
                  )

                  if not data:
                      break

                  repositories.extend(data)

                  if len(data) < 100:
                      break

                  page += 1

              return repositories


          def get_contributor_count(full_name):
              url = (
                  f"https://api.github.com/repos/"
                  f"{full_name}/contributors"
                  f"?per_page=1&anon=true"
              )

              try:
                  status, data = github_get(url)

                  if isinstance(data, list):
                      return len(data)

                  return 0

              except Exception:
                  return 0


          def get_contributor_count_proper(full_name):
              page = 1
              count = 0

              while True:
                  url = (
                      f"https://api.github.com/repos/"
                      f"{full_name}/contributors"
                      f"?per_page=100&page={page}&anon=true"
                  )

                  try:
                      status, data = github_get(url)

                      if not data:
                          break

                      count += len(data)

                      if len(data) < 100:
                          break

                      page += 1

                  except Exception:
                      break

              return count


          def get_views(full_name):
              url = (
                  f"https://api.github.com/repos/"
                  f"{full_name}/traffic/views"
              )

              try:
                  status, data = github_get(url)

                  return data.get("uniques", 0)

              except urllib.error.HTTPError:
                  return None

              except Exception:
                  return None


          personal_repositories = get_all_repositories(
              f"https://api.github.com/users/{USER}/repos"
          )

          organization_repositories = get_all_repositories(
              f"https://api.github.com/orgs/{ORGANIZATION}/repos"
          )


          repositories = {}

          for repository in (
              personal_repositories
              + organization_repositories
          ):
              repositories[
                  repository["full_name"]
              ] = repository


          repositories = [
              repository
              for repository in repositories.values()
              if repository["full_name"] not in HIDDEN_REPOS
          ]


          repositories.sort(
              key=lambda repository: repository.get(
                  "updated_at",
                  ""
              ),
              reverse=True,
          )


          repositories = repositories[:MAX_REPOS]


          WIDTH = 1000
          CARD_WIDTH = 460
          CARD_HEIGHT = 175

          LEFT_MARGIN = 30
          TOP_MARGIN = 70

          GAP_X = 20
          GAP_Y = 20

          COLUMNS = 2


          rows = max(
              1,
              (len(repositories) + COLUMNS - 1) // COLUMNS
          )


          HEIGHT = (
              TOP_MARGIN
              + rows * CARD_HEIGHT
              + (rows - 1) * GAP_Y
              + 35
          )


          def escape(value):
              return html.escape(
                  str(value or "")
              )


          def shorten(value, length):
              value = str(value or "")

              if len(value) <= length:
                  return value

              return value[:length - 3] + "..."


          cards = []


          for index, repository in enumerate(repositories):

              column = index % COLUMNS
              row = index // COLUMNS

              x = (
                  LEFT_MARGIN
                  + column * (CARD_WIDTH + GAP_X)
              )

              y = (
                  TOP_MARGIN
                  + row * (CARD_HEIGHT + GAP_Y)
              )


              full_name = repository["full_name"]

              name = escape(
                  shorten(
                      repository["name"],
                      30,
                  )
              )


              if (
                  repository["owner"]["login"].lower()
                  == USER.lower()
              ):
                  location = "BananaOfficial"
              else:
                  location = "RequestTimeout"


              description = escape(
                  shorten(
                      repository.get("description")
                      or "No description.",
                      62,
                  )
              )


              contributors = (
                  get_contributor_count_proper(
                      full_name
                  )
              )


              stars = (
                  repository.get(
                      "stargazers_count",
                      0,
                  )
              )


              forks = (
                  repository.get(
                      "forks_count",
                      0,
                  )
              )


              views = get_views(
                  full_name
              )


              if views is None:
                  views_text = "Unavailable"
              else:
                  views_text = str(views)


              cards.append(
                  f"""
                  <g>

                    <rect
                      x="{x}"
                      y="{y}"
                      width="{CARD_WIDTH}"
                      height="{CARD_HEIGHT}"
                      rx="16"
                      class="card"
                    />

                    <rect
                      x="{x}"
                      y="{y}"
                      width="6"
                      height="{CARD_HEIGHT}"
                      rx="3"
                      class="accent"
                    />

                    <text
                      x="{x + 24}"
                      y="{y + 32}"
                      class="title"
                    >{name}</text>

                    <text
                      x="{x + 24}"
                      y="{y + 54}"
                      class="location"
                    >{escape(location)}</text>

                    <text
                      x="{x + 24}"
                      y="{y + 82}"
                      class="description"
                    >{description}</text>

                    <line
                      x1="{x + 24}"
                      y1="{y + 100}"
                      x2="{x + CARD_WIDTH - 24}"
                      y2="{y + 100}"
                      class="divider"
                    />

                    <text
                      x="{x + 24}"
                      y="{y + 128}"
                      class="label"
                    >Contributors</text>

                    <text
                      x="{x + 24}"
                      y="{y + 150}"
                      class="value"
                    >{contributors}</text>

                    <text
                      x="{x + 140}"
                      y="{y + 128}"
                      class="label"
                    >Stars</text>

                    <text
                      x="{x + 140}"
                      y="{y + 150}"
                      class="value"
                    >{stars}</text>

                    <text
                      x="{x + 225}"
                      y="{y + 128}"
                      class="label"
                    >Views</text>

                    <text
                      x="{x + 225}"
                      y="{y + 150}"
                      class="value"
                    >{views_text}</text>

                    <text
                      x="{x + 330}"
                      y="{y + 128}"
                      class="label"
                    >Forks</text>

                    <text
                      x="{x + 330}"
                      y="{y + 150}"
                      class="value"
                    >{forks}</text>

                  </g>
                  """
              )


          svg = f"""
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="{WIDTH}"
            height="{HEIGHT}"
            viewBox="0 0 {WIDTH} {HEIGHT}"
          >

            <style>

              .background {{
                fill: #0d1117;
              }}

              .card {{
                fill: #161b22;
                stroke: #30363d;
                stroke-width: 1.5;
              }}

              .accent {{
                fill: #3fb950;
              }}

              .title {{
                fill: #f0f6fc;
                font-family: Arial, sans-serif;
                font-size: 19px;
                font-weight: bold;
              }}

              .location {{
                fill: #3fb950;
                font-family: Arial, sans-serif;
                font-size: 12px;
              }}

              .description {{
                fill: #8b949e;
                font-family: Arial, sans-serif;
                font-size: 12px;
              }}

              .divider {{
                stroke: #30363d;
                stroke-width: 1;
              }}

              .label {{
                fill: #8b949e;
                font-family: Arial, sans-serif;
                font-size: 11px;
              }}

              .value {{
                fill: #f0f6fc;
                font-family: Arial, sans-serif;
                font-size: 16px;
                font-weight: bold;
              }}

              .header {{
                fill: #f0f6fc;
                font-family: Arial, sans-serif;
                font-size: 20px;
                font-weight: bold;
              }}

              .subtitle {{
                fill: #8b949e;
                font-family: Arial, sans-serif;
                font-size: 12px;
              }}

            </style>


            <rect
              width="100%"
              height="100%"
              rx="20"
              class="background"
            />


            <text
              x="30"
              y="32"
              class="header"
            >
              Repositories
            </text>


            <text
              x="30"
              y="52"
              class="subtitle"
            >
              BananaOfficial + RequestTimeout
            </text>


            {''.join(cards)}

          </svg>
          """


          Path(
              "repo-stats.svg"
          ).write_text(
              svg,
              encoding="utf-8",
          )


          print(
              f"Generated statistics for "
              f"{len(repositories)} repositories."
          )

          PY

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add repo-stats.svg

          git diff --cached --quiet || \
            git commit -m "Update repository statistics"

          git push
