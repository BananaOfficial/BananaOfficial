<svg width="44" height="44" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg" >
  <rect width="44" height="44" fill="#0D1117"/>
  <defs>
    <g id="star">
      <text x="0" y="0" fill="#9D9D9D" font-family="monospace" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="central" >*</text>
    </g>
  </defs>
  <g transform="translate(22 22)">
    <g> <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
      <use href="#star" transform="translate(0 -11)"/>
      <use href="#star" transform="rotate(30) translate(0 -11)"/>
      <use href="#star" transform="rotate(60) translate(0 -11)"/>
      <use href="#star" transform="rotate(90) translate(0 -11)"/>
      <use href="#star" transform="rotate(120) translate(0 -11)"/>
      <use href="#star" transform="rotate(150) translate(0 -11)"/>
      <use href="#star" transform="rotate(180) translate(0 -11)"/>
      <use href="#star" transform="rotate(210) translate(0 -11)"/>
    </g>
  </g>
</svg>
