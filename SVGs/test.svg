<svg
  width="220"
  height="220"
  viewBox="0 0 220 220"
  xmlns="http://www.w3.org/2000/svg"
>
  <rect width="220" height="220" fill="#0D1117"/>

  <g
    fill="#9D9D9D"
    font-family="monospace"
    font-size="16"
    text-anchor="middle"
    dominant-baseline="middle"
  >
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 110 110"
        to="360 110 110"
        dur="12s"
        repeatCount="indefinite"
      />

      <text x="110" y="38">*</text>
      <text x="146" y="48">*</text>
      <text x="172" y="74">*</text>
      <text x="182" y="110">*</text>
      <text x="172" y="146">*</text>
      <text x="146" y="172">*</text>
      <text x="110" y="182">*</text>
      <text x="74" y="172">*</text>
      <text x="48" y="146">*</text>
      <text x="38" y="110">*</text>
      <text x="48" y="74">*</text>
      <text x="74" y="48">*</text>
    </g>

    <text
      x="110"
      y="110"
      fill="#F0F6FC"
      font-size="22"
    >*</text>
  </g>
</svg>
